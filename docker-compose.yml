name: boostify

services:
  # Bundled Postgres — only started when the "local-db" profile is active
  # (COMPOSE_PROFILES=local-db in .env). Disable it if you use an external DB.
  db:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: boostify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boostify}
      POSTGRES_DB: boostify
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boostify -d boostify"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    # Builds locally if the image isn't pulled yet (compose pulls otherwise)
    build:
      context: .
      network: host   # build containers use the host's network, skipping the bridge/DNS path
    image: ghcr.io/teamboostify/boostify:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        # Warns instead of failing when the "local-db" profile is off (external DB)
        required: false
    env_file:
      - path: .env
        required: false
    environment:
      # If DATABASE_URL is set in .env (external/managed Postgres) it wins,
      # otherwise the bot talks to the bundled `db` service.
      DATABASE_URL: ${DATABASE_URL:-postgresql://boostify:${POSTGRES_PASSWORD:-boostify}@db:5432/boostify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boostify}

volumes:
  db-data:
